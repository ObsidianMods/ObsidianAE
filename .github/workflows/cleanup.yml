name: daily-cleanup

# Full wipe, every night: Actions caches and old build artifacts are
# transient CI bulk — this deletes them repo-wide so storage never grows.
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  wipe:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all Actions caches
        # gh exits 1 with "No caches to delete" on an empty cache —
        # that is a clean repo, not a failure.
        run: gh cache delete --all --repo "$GITHUB_REPOSITORY" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete all workflow artifacts
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --paginate -q '.artifacts[].id')
          for id in $ids; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" >/dev/null
          done
          echo "deleted artifacts: $(echo "$ids" | wc -w)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete completed/failed runs (skip in-progress)
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --paginate -q '.workflow_runs[] | select(.status == "completed") | .id')
          for id in $ids; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null
          done
          echo "deleted runs: $(echo "$ids" | wc -w)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
